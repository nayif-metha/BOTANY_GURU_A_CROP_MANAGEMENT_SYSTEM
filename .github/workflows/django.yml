name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

   
    - name: Install Python packages
      run: |
        pip3 install --upgrade pip
        pip3 install -r requirements.txt

    - name: Run tests
      run: |
        python3 -m unittest discover
